name: Setup yarnrc.yml
description: Run yarn config commands so that @navikt/ packages are resolved from github package registry, with neccessary auth.
inputs:
  npmAuthToken:
    description: Token that has packages:read permission for the navikt organization.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        corepack enable
        # --home skriver til $HOME/.yarnrc.yml, ikke den sporede repo-filen, slik at token aldri havner i en diff og dermed ikke bør bli committet ved uhell.
        yarn config set --home npmScopes.navikt.npmRegistryServer "https://npm.pkg.github.com"
        yarn config set --home npmScopes.navikt.npmAlwaysAuth true
        yarn config set --home npmScopes.navikt.npmAuthToken ${{ inputs.npmAuthToken }}
        yarn config set --home npmScopes.nais.npmRegistryServer "https://npm.pkg.github.com"
        yarn config set --home npmScopes.nais.npmAlwaysAuth true
        yarn config set --home npmScopes.nais.npmAuthToken ${{ inputs.npmAuthToken }}
