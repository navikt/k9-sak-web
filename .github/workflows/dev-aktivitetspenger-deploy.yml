name: Build and deploy dev-aktivitetspenger
on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'CODEOWNERS'
    branches:
      - aktivitetspenger-kort-ned-maksperiode

jobs:
  build-deploy:
    name: Build and deploy Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      CLUSTER: dev-gcp
    steps:
      - name: Hente kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup + Install
        uses: ./.github/actions/setup-install
        with:
          npmAuthToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygge dist
        run: yarn build:ung
        env:
          VITE_CDN_BASE_URL: "https://cdn.nav.no/k9saksbehandling/aktivitetspenger-sak-web/"

      - name: Last opp assets til CDN
        uses: nais/deploy/actions/cdn-upload/v2@65d1b089882173f50fd51161b1a5b6ef3a18b9ea
        with:
          source: dist/ung/web/
          destination: aktivitetspenger-sak-web/
          team: k9saksbehandling
          source_keep_parent_name: false
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

      - name: Bygg server
        uses: ./.github/actions/build-server

      - name: Build and push to docker registry
        uses: navikt/sif-gha-workflows/.github/actions/maven/build-push-docker-image@97a944ba12c0db588a29cfeed8a7dcb22e087d3f # v1.0.1
        id: docker-push
        with:
          additional-tag: 'dev-aktivitetspenger'
          image_base_name: 'ung-sak-web'
          without_navikt_prefix: true
          build-args: |
            featureToggles=ung.feature-toggles.json
            proxyConfig=ung.proxy.nginx
            appVariant=ung
            port=9005
          push-image: true
      - name: Deploy to nais
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: ${{ env.CLUSTER }}
          RESOURCE: deploy/ung/dev-gcp.yml
          VARS: deploy/ung/dev-aktivitetspenger.yaml
          VAR: image=${{ steps.docker-push.outputs.image }}
