name: "Storybook Tests"
permissions:
  contents: read
  packages: read
on:
  workflow_call:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Hente kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup + Install
        uses: ./.github/actions/setup-install
        with:
          npmAuthToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: yarn build-storybook-test --quiet

      - name: Serve Storybook and run tests
        run: |
          yarn concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "yarn http-server .static_storybook --port 9001 --silent" \
            "yarn wait-on --timeout 60000 tcp:127.0.0.1:9001 && yarn test-storybook --maxWorkers=2"
